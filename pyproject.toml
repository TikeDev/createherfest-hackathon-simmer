# Vercel's Python builder synthesizes a pyproject.toml from requirements.txt
# when none exists, and writes an impossible `requires-python = "~=3.0.0"`
# that no interpreter satisfies. Committing this file avoids that.
# Runtime deps must stay in sync with requirements.txt (ruff is dev-only and
# is intentionally excluded here).
[project]
name = "simmer-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "recipe-scrapers==15.12.0",
  "curl_cffi==0.16.0",
  "requests>=2.32",
]
